[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SKIP_WEB_DEMOS = "1"

[[redirects]]
  from = "/demo/guest-guide/*"
  to = "/demo/guest-guide/index.html"
  status = 200

[[redirects]]
  from = "/demo/finance/*"
  to = "/demo/finance/index.html"
  status = 200

[[redirects]]
  from = "/demo/*"
  to = "/demo/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
